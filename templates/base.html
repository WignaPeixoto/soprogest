<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SoproGest</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <a href="{{ url_for('index') }}">🐾 SoproGest</a>

    <nav>
        <a href="{{ url_for('animais') }}">Animais</a>

        {% if session.get('usuario') %}
            <a href="{{ url_for('logout') }}">Sair</a>
        {% else %}
            <a href="{{ url_for('login') }}">Entrar</a>
        {% endif %}

        <button
            type="button"
            id="botao-contraste"
            aria-pressed="false"
            onclick="alternarContraste()">
            ♿ Alto contraste
        </button>
    </nav>
</header>

<main>
    {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
        <div class="alerta {{ categoria }}" role="alert">
            {{ mensagem }}
        </div>
    {% endfor %}

    {% block content %}{% endblock %}
</main>

<footer>
    Projeto acadêmico • ONG Sopro da Vida • MVP demonstrativo
</footer>

<script>
    function alternarContraste() {
        const ativo = document.body.classList.toggle('alto-contraste');

        localStorage.setItem('altoContraste', ativo ? 'sim' : 'nao');

        document.getElementById('botao-contraste')
            .setAttribute('aria-pressed', String(ativo));
    }

    if (localStorage.getItem('altoContraste') === 'sim') {
        document.body.classList.add('alto-contraste');

        document.getElementById('botao-contraste')
            .setAttribute('aria-pressed', 'true');
    }
</script>

</body>
</html>
